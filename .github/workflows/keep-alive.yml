name: Keep Philo-RAG Alive

on:
  schedule:
    # 10분마다 실행 (분 시 일 월 요일)
    # 한국 시간 08:30 ~ 18:30은 UTC 기준 23:30 ~ 09:30입니다.
    # 08:30-08:50 KST (23:30-23:50 UTC)
    - cron: '30-59/10 23 * * *'
    # 09:00-17:50 KST (00:00-08:50 UTC)
    - cron: '*/10 0-8 * * *'
    # 18:00-18:30 KST (09:00-09:30 UTC)
    - cron: '0-30/10 9 * * *'
  workflow_dispatch: # 수동 실행 가능하도록 추가

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-alive Request
        run: |
          set -uo pipefail
          URLS=(
            "https://philo-rag-backend.onrender.com/health"
            "https://jjadfpnpfuxjbmkxyhqt.supabase.co/rest/v1/"
          )
          EXIT_STATUS=0
          for url in "${URLS[@]}"; do
            echo "Pinging $url..."
            # Render (/health) is GET-only. Supabase root (/ ) returns 404.
            # Using -L to follow redirects and removing -I to use GET.
            # We allow 4xx (like 401 Unauthorized for Supabase) as it still indicates the service is up.
            HTTP_CODE=$(curl -s -L -o /dev/null -w "%{http_code}" --connect-timeout 30 --max-time 120 --retry 3 "$url")
            echo "HTTP Status for $url: $HTTP_CODE"
            
            if [[ "$HTTP_CODE" -ge 200 && "$HTTP_CODE" -lt 500 ]]; then
              echo "Keep-alive ping sent to $url at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            else
              echo "::error::Failed to ping $url (Status: $HTTP_CODE)"
              EXIT_STATUS=1
            fi
          done
          exit $EXIT_STATUS
